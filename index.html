<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus GAR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Graduate&display=swap" rel="stylesheet">
<style>
/* Campus GAR: identidad de Grupo Asesores RAM (azul marino de tinta, naranja de acento, Archivo) y el nombre Campus en letra universitaria. Layout: barra superior con logo y tablero en una sola columna ancha. */
:root{
  --bg:#F3F5F8; --card:#ffffff; --ink:#13233A; --muted:#5B6B7F; --line:#DCE2EA; --soft:#E8EEF6;
  --accent:#16325A; --accent-ink:#ffffff; --gold:#B8520D; --orange:#EE7623;
  --ok:#23845A; --ok-bg:#DDF2E7; --warn:#9A6505; --warn-bg:#FBF0D5; --bad:#C0402E; --bad-bg:#F9E1DC; --off:#6B7680; --off-bg:#ECEFF2;
  --f-display:"Archivo",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-college:"Graduate","Rockwell","Georgia",serif;
  --logo-filter:none;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A2A; --card:#16243A; --ink:#E8EDF4; --muted:#9AAAC0; --line:#26395A; --soft:#1B2B44;
    --accent:#8FB3E8; --accent-ink:#0F1A2A; --gold:#F4863C; --orange:#F4863C;
    --ok:#4CC08A; --ok-bg:#173A2C; --warn:#E3AE3A; --warn-bg:#3A3118; --bad:#EE7A68; --bad-bg:#3E211E; --off:#8D999F; --off-bg:#1D2A3A;
    --logo-filter:brightness(0) invert(.94);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A2A; --card:#16243A; --ink:#E8EDF4; --muted:#9AAAC0; --line:#26395A; --soft:#1B2B44;
  --accent:#8FB3E8; --accent-ink:#0F1A2A; --gold:#F4863C; --orange:#F4863C;
  --ok:#4CC08A; --ok-bg:#173A2C; --warn:#E3AE3A; --warn-bg:#3A3118; --bad:#EE7A68; --bad-bg:#3E211E; --off:#8D999F; --off-bg:#1D2A3A;
  --logo-filter:brightness(0) invert(.94);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px} h2{font-size:19px} h3{font-size:15px;font-family:var(--f-body);font-weight:700}
.num,td.n,.tnum{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.logo{height:50px;width:auto;display:block;filter:var(--logo-filter)}
.sep{width:1px;height:36px;background:var(--line)}
.wordmark{display:flex;flex-direction:column;font-family:var(--f-college);font-size:33px;line-height:.95;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);text-shadow:2px 2px 0 var(--orange)}
.wordmark small{font-family:var(--f-body);font-size:10px;font-weight:700;letter-spacing:.24em;color:var(--muted);text-shadow:none;margin-top:4px}
.kxw{font-family:"Graduate","Rockwell",Georgia,serif;font-size:26px;text-transform:uppercase;letter-spacing:.05em;color:#16325A;text-shadow:2px 2px 0 #EE7623;line-height:1}
h1,h2{font-stretch:112%}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{background:none;border:0;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600}
.nav button[aria-current="page"]{background:var(--soft);color:var(--accent)}
.who{margin-left:auto}.sync{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--off)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
main{max-width:1240px;margin:0 auto;padding:20px 20px 60px;display:grid;gap:18px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:var(--r);padding:10px 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card > h2,.card > h3{margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left}
.tile b{display:block;font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:13px}
.tile.alert b{color:var(--bad)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-align:left}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.gold{background:color-mix(in srgb,var(--gold) 15%,transparent);color:var(--gold)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.off{background:var(--off-bg);color:var(--off)}
.muted{color:var(--muted)} .small{font-size:13px}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right}
tr.off td{opacity:.6}
.bar{height:7px;border-radius:9px;background:var(--line);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=search],input[type=date],input[type=number],input[type=email],input[type=tel],input[type=url],select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 9px;min-width:0}
textarea{width:100%;min-height:70px;resize:vertical}
.f{display:grid;gap:3px;font-size:13px;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{color:var(--ink);font-weight:500;font-size:14px;width:100%}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.form .wide{grid-column:1/-1}
.check{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.check li{display:flex;gap:9px;align-items:flex-start;font-size:14px}
.check li .ic{flex:none;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:1px}
.check li.ok .ic{background:var(--ok-bg);color:var(--ok)}
.check li.no .ic{background:var(--warn-bg);color:var(--warn)}
.check li.no{font-weight:600}
.check .lk{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-align:left;text-decoration:underline dotted;text-underline-offset:3px}
.check .lk:hover{color:var(--accent)}
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.step{flex:1 1 120px;border-radius:8px;padding:8px 10px;background:var(--off-bg);color:var(--off);font-size:13px;border:1px solid transparent}
.step b{display:block;font-size:13.5px}
.step.done{background:var(--ok-bg);color:var(--ok)}
.step.cur{background:var(--card);color:var(--ink);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.plazo{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:6px 0;border-top:1px dashed var(--line)}
.score{display:flex;align-items:baseline;gap:10px}
.score b{font-family:var(--f-display);font-size:38px;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.fx td input,.fx td select{width:100%}
.fx td.c input{width:58px;text-align:center}
tr.pend td:first-child{border-left:3px solid var(--warn)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{stroke:var(--line)} .chart .lb{fill:var(--muted);font-size:11px} .chart .br{fill:var(--accent)} .chart .br.ok{fill:var(--ok)} .chart .mt{stroke:var(--gold);stroke-dasharray:5 4;stroke-width:1.5} .chart .ml{fill:var(--gold);font-size:11px;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(10,20,25,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal[hidden]{display:none}
.dlg{background:var(--card);border-radius:12px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:20px;display:grid;gap:14px;border:1px solid var(--line)}
.dlg.wide{max-width:900px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:14px;z-index:60;max-width:90vw}
.toast[hidden]{display:none}
.file{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.file input[type=file]{font-size:12.5px;max-width:230px}
.q{display:grid;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.q p{margin:0}
.av{border-radius:50%;object-fit:cover;background:var(--soft);color:var(--accent);display:inline-grid;place-items:center;font-weight:700;flex:none;overflow:hidden}
.who{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.kx{background:#fff;color:#14212b;padding:24px;border-radius:8px;font:14px/1.45 var(--f-body)}
.kx h1{font-size:22px;color:#16325A}.kx h2{font-size:15px;margin:16px 0 6px;color:#16325A;border-bottom:2px solid #EE7623;padding-bottom:3px}
.kx table{font-size:13px}.kx th,.kx td{padding:5px 8px;border-bottom:1px solid #dbe2e7;color:#14212b}
.kx .note{font-size:12px;color:#5a6873}
@media (max-width:560px){.logo{height:32px}.sep,.wordmark small{display:none}.wordmark{font-size:24px}h1{font-size:22px}.top-in{padding:10px 14px}main{padding:14px 14px 50px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function tabsFor(p){const r=route(p);const T=[["datos","Datos"]];r.forEach(e=>T.push(["e"+e,`${e} · ${ETAPAS[e]}`]));T.push(["ideas","Cursos IDEAS"],["ventas","Ventas"],["actividad","Actividad"],["expediente","Expediente"],["bitacora","Bitácora"]);if(p.salida&&p.salida.tipo==="Agente Referidor")T.push(["referidor","Referidor"]);return T}
function fichaSummary(p){
  const r=route(p),s=semaforo(p),L=checklist(p),pl=plazos(p),ma=mesAgente(p),sc=scoreADT(p);

     ${(p.e2||{}).generacion?`<span class="muted">Gen. ${esc(p.e2.generacion)}</span>`:""}${p.gerente?`<span class="muted">GD: ${esc(p.gerente)}</span>`:""}${ma&&ma.n?`<span class="muted">Mes agente ${ma.n}</span>`:""}</div></div></div>
    <div class="row">${S.downloads||true?`<button class="btn" data-act="kardex">Estado de cuenta (kardex)</button>`:""}

     ${S.isAdmin?`<button class="btn danger" data-act="borrar">Eliminar</button>`:""}</div></div>
    ${p.salida?`<p class="banner" style="margin:12px 0 0">${esc(p.salida.tipo)} desde ${fdate(p.salida.fecha)}${p.salida.motivo?": "+esc(p.salida.motivo):""}${p.salida.tipo==="Suspendido"?". No puede ingresar ventas ni gestionar su cartera hasta reconectarse con cédula definitiva; si no reingresa, su cartera pasa a la clave puente de la agencia.":""}</p>`:""}
  </div>`;

    ${pl.length?`<div style="margin-top:10px">${pl.map(x=>`<div class="plazo"><span>${esc(x.l)}</span><span class="${x.dl<0?"pill bad":x.dl<=3?"pill warn":"muted"}">${fdate(x.d)} · ${daysTxt(x.dl)}</span></div>`).join("")}</div>`:""}
    ${next&&S.canWrite!==false&&!p.salida?`<div class="row" style="margin-top:12px"><button class="btn primary" data-act="avanzar"${allOk||S.isAdmin?"":" disabled"}>Pasar a etapa ${next}</button>${!allOk?`<span class="muted small">${S.isAdmin?"Faltan pendientes: como administrador puedes pasarlo de todos modos.":"Se habilita al cumplir todos los pendientes."}</span>`:""}</div>`:""}
  </div>`;
  const koTxt=sc.ko?`<p class="small" style="margin:8px 0 0;color:${sc.ko>=3?"var(--bad)":"var(--warn)"}"><b>${sc.ko} factor${sc.ko>1?"es":""} Knock Out.</b> ${sc.ko>=3?"No continúa en el proceso.":"Revísalo en la siguiente entrevista."}</p>`:"";
  const scoreCard=(p.etapa||1)<=2||sc.score!=null?`<div class="card"><h2>Score de reclutamiento</h2>${sc.score==null?`<p class="muted">Se calcula al capturar el PSP y las calificaciones de las entrevistas.</p>${sc.ko>=3?pill(sc.sem):""}${koTxt}`:koTxt+`
    <div class="score"><b>${sc.score}</b><span>de 100${sc.partial?" · parcial":""}</span></div>${pill(sc.sem)}${sc.sem.why?`<p class="small" style="margin:6px 0 0"><b>Por qué:</b> ${esc(sc.sem.why)}</p>`:""}
    <dl class="kv" style="margin-top:10px"><dt>PSP (60%)</dt><dd>${sc.psp??"—"}</dd><dt>Vitales (25%)</dt><dd>${sc.vit??"—"}</dd><dt>Transversales (15%)</dt><dd>${sc.tr??"—"}</dd></dl>

  const prodCard=p.conexion&&p.conexion.alta?`<div class="card chart"><h2>Producción por mes agente</h2>${chart(p)}</div>`:"";
  const w=isoWeek(todayISO()),aw=(p.actividad||{})[w]||{};

  return head+stepper+`<div class="grid g2">${gate}${scoreCard||prodCard||actCard}</div><div class="grid g3">${scoreCard?prodCard:""}${scoreCard||prodCard?actCard:""}${expCard}</div>`;

function cartasDe(p){return p.ruta==="cedula"?[["c4","Carta 4 · Integración de Agente con Cédula"]]:[["c1","Carta 1 · Candidato Agente"],["c2","Carta 2 · Agente Provisional"],["c3","Carta 3 · Cambio de esquema"]]}
function chart(p){
  const a=p.conexion.alta,m=M(),ma=mesAgente(p);const n=Math.max(1,Math.min(ma?ma.n:1,24));const start=Math.max(1,n-5);
  const meta=(p.etapa===4||p.etapa===5)?m.provisional2m/2:(p.ruta==="cedula"?m.permCedula:m.permNuevo);
  const pts=[];for(let i=start;i<=n;i++){const ini=addMonths(a,i-1),fin=addMonths(a,i);pts.push({l:"M"+i,v:ventasEntre(p,ini,fin)})}
  const W=560,H=190,pl=56,pb=26,pt=14,max=Math.max(meta,...pts.map(x=>x.v))*1.15||1;
  const y=v=>pt+(H-pt-pb)*(1-v/max),bw=Math.min(54,(W-pl-10)/pts.length*.6);
  const ticks=[0,max/2,max].map(v=>Math.round(v/1000)*1000);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Producción por mes agente contra la meta de ${money(meta)}">
   ${ticks.map(t=>`<line class="ax" x1="${pl}" x2="${W-6}" y1="${y(t)}" y2="${y(t)}"/><text class="lb" x="${pl-6}" y="${y(t)+4}" text-anchor="end">${t>=1000?Math.round(t/1000)+"k":t}</text>`).join("")}
   ${pts.map((d,i)=>{const cx=pl+(i+.5)*(W-pl-10)/pts.length;return `<rect class="br ${d.v>=meta?"ok":""}" x="${cx-bw/2}" y="${y(d.v)}" width="${bw}" height="${Math.max(0,H-pb-y(d.v))}" rx="3"><title>${d.l}: ${money(d.v)}</title></rect><text class="lb" x="${cx}" y="${H-8}" text-anchor="middle">${d.l}</text>${d.v?`<text class="lb" x="${cx}" y="${y(d.v)-4}" text-anchor="middle">${Math.round(d.v/1000)}k</text>`:""}`}).join("")}
   <line class="mt" x1="${pl}" x2="${W-6}" y1="${y(meta)}" y2="${y(meta)}"/><text class="ml" x="${W-8}" y="${y(meta)-5}" text-anchor="end">Meta ${money(meta)}</text></svg>
   <p class="muted small" style="margin:6px 0 0">Prima pagada por mes agente (aniversario de la conexión: ${fdate(a)}).</p>`;
}

const KX_CSS=`@import url("https://fonts.googleapis.com/css2?family=Graduate&family=Archivo:wght@400;600;700&display=swap");.kxw{font-family:"Graduate",Rockwell,Georgia,serif;font-size:26px;text-transform:uppercase;letter-spacing:.05em;color:#16325A;text-shadow:2px 2px 0 #EE7623;line-height:1}body{margin:0;background:#fff;font:14px/1.45 "Archivo","Segoe UI",system-ui,sans-serif;color:#13233A}.kx{max-width:860px;margin:0 auto;padding:28px}h1{font-size:22px;color:#16325A;margin:0}h2{font-size:15px;margin:18px 0 6px;color:#16325A;border-bottom:2px solid #EE7623;padding-bottom:3px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:5px 8px;border-bottom:1px solid #dbe2e7;text-align:left}.note{font-size:12px;color:#5a6873}@media print{.kx{padding:0}}`;

document.addEventListener("click",async ev=>{
  const t=ev.target.closest("[data-nav],[data-open],[data-openexp],[data-act],[data-tab],[data-ask]");if(!t)return;
  if(t.dataset.openexp){S.openId=t.dataset.openexp;S.tab="expediente";render();const tb=document.querySelector(".tabs");if(tb)tb.scrollIntoView({block:"start"});return}
  if(t.dataset.ask!==undefined){const r=S._ask;S._ask=null;closeModal();if(r)r(t.dataset.ask==="1");return}
  if(t.dataset.nav){S.view=t.dataset.nav;S.openId=null;try{location.hash=S.view}catch(e){}render();window.scrollTo(0,0);return}
  if(t.dataset.open){S.openId=t.dataset.open;S.tab=null;render();window.scrollTo(0,0);return}
  if(t.dataset.tab){S.tab=t.dataset.tab;$("#fx-tab").innerHTML=tabContent(cur(),S.tab);document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));drawNames();if(t.closest("#fx-sum")){const tb=document.querySelector(".tabs");if(tb)tb.scrollIntoView({behavior:"smooth",block:"start"})}return}
  const a=t.dataset.act,p=cur(),id=S.openId;
  if(a==="close"){S.openId=null;render();return}
  if(a==="fEtapa"){S.filters.exp=false;S.filters.etapa=t.dataset.v;S.filters.estado="activos";S.filters.sem="";render();return}
  if(a==="fExp"){S.filters.exp=true;S.filters.etapa="";S.filters.sem="";S.filters.estado="activos";render();return}
  if(a==="logout"){logout();return}
  if(a==="quitarFoto"){p.foto=null;save(id,["foto"]);refreshTab();refreshSum();return}
  if(a==="fAlert"){S.filters.exp=false;S.filters.sem="bad";S.filters.etapa="";S.filters.estado="activos";render();return}
  if(a==="nuevo")return nuevoModal();
  if(a==="crear")return crearPersona();
  if(a==="cancel")return closeModal();
  if(a==="kardex"){modal(`<div class="spread"><h2>Estado de cuenta (kardex)</h2><div class="row"><button class="btn primary" data-act="kxPrint">Imprimir o guardar PDF</button><button class="btn" data-act="kxSave">Descargar HTML</button><button class="btn" data-act="cancel">Cerrar</button></div></div><p class="muted small">No incluye el score de reclutamiento ni el PSP, que son confidenciales.</p>${kardexBody(p)}`,true);return}
  if(a==="kxPrint"){const w=window.open("","_blank");if(!w){toast("Tu navegador bloqueó la ventana. Permite ventanas emergentes para Campus.");return}w.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Kardex ${esc(p.nombre||"")}</title><style>${KX_CSS}</style></head><body>${kardexBody(p)}<script>setTimeout(()=>window.print(),400)<\/script></body></html>`);w.document.close();return}
  if(a==="kxSave"){const html=`<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Kardex ${esc(p.nombre||"")}</title><style>${KX_CSS}</style></head><body>${kardexBody(p)}</body></html>`;
    const url=URL.createObjectURL(new Blob([html],{type:"text/html"}));const l=document.createElement("a");l.href=url;l.download=`Kardex ${p.nombre||"agente"} ${todayISO()}.html`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);return}
  if(a==="avanzar"){const r=route(p),nx=r[r.indexOf(p.etapa||1)+1];if(!nx)return;const L=checklist(p);
    if(!L.every(i=>i.ok)){const ok=await ask("Pasar con pendientes",`Faltan ${L.filter(i=>!i.ok).length} pendientes de la etapa ${p.etapa}. ¿Pasar a ${nx} · ${ETAPAS[nx]} de todos modos?`,"Pasar de etapa");if(!ok)return}
    p.etapa=nx;p.fechas=Object.assign({},p.fechas,{["e"+nx]:todayISO()});
    if(nx===3){p.e3=p.e3||{};if(!p.e3.inicio)p.e3.inicio=(p.ruta==="cedula"?(p.e2||{}).cierre:((p.e2||{}).fechaCert||(p.e2||{}).fin))||todayISO()}
    save(id,["etapa","fechas","e3"]);S.tab="e"+nx;render();toast(`Pasó a la etapa ${nx} · ${ETAPAS[nx]}.`);return}
  if(a==="salida"){modal(`<h2>Registrar salida</h2><div class="form"><label class="f"><span>Tipo</span><select id="s-tipo">${SALIDAS.map(s=>`<option>${s}</option>`).join("")}</select></label><label class="f"><span>Fecha</span><input id="s-fecha" type="date" value="${todayISO()}"></label><label class="f wide"><span>Motivo</span><textarea id="s-motivo"></textarea></label></div><p class="muted small">Suspendido: provisional vencido sin cambio de esquema. No puede ingresar ventas ni gestionar su cartera; si no reingresa, su cartera pasa a la clave puente de la agencia.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="cancel">Cancelar</button><button class="btn primary" data-act="salidaOk">Registrar</button></div>`);return}
  if(a==="salidaOk"){p.salida={tipo:$("#s-tipo").value,fecha:$("#s-fecha").value||todayISO(),motivo:$("#s-motivo").value.trim()};closeModal();save(id,["salida"]);render();return}
  if(a==="reactivar"){const ok=await ask("Reactivar",`${esc(p.nombre)} vuelve a la etapa ${p.etapa} · ${ETAPAS[p.etapa]}.`,"Reactivar");if(!ok)return;p.bitacora=(p.bitacora||[]).concat([{id:uid(),fecha:todayISO(),autor:S.me?S.me.nombre:"",texto:`Reactivado. Salida previa: ${p.salida.tipo} (${fdate(p.salida.fecha)}).`}]);p.salida=null;save(id,["salida","bitacora"]);render();return}
  if(a==="borrar"){const ok=await ask("Eliminar expediente",`Se borra el expediente de ${esc(p.nombre)} para todos. Esto no se puede deshacer.`,"Eliminar");if(!ok)return;S.openId=null;if(!S.demo){try{await api("delete",{id});S.personas.delete(id);toast("Expediente eliminado.")}catch(e){toast(errMsg(e))}}else{S.personas.delete(id)}render();return}
  if(a==="addRow"){const path=t.dataset.list;const arr=(getP(p,path)||[]).slice();arr.push({id:uid()});setP(p,path,arr);save(id,[path.split(".")[0]]);refreshTab();return}
  if(a==="delRow"){const path=t.dataset.list,i=+t.dataset.i;const ok=await ask("Quitar registro","Se quita este renglón para todos.","Quitar");if(!ok)return;const arr=(getP(p,path)||[]).slice();arr.splice(i,1);setP(p,path,arr);save(id,[path.split(".")[0]]);refreshTab();refreshSum();return}
  if(a==="addVenta"){if(p.salida&&p.salida.tipo==="Suspendido")return;const v={id:uid(),fecha:todayISO(),ramo:"Vida Individual",prima:"",contado:false,negocio:""};if(t.dataset.arr==="1"){const r=arranque(p);v.negocio=r.ok1?"2":"1"}p.ventas=(p.ventas||[]).concat([v]);save(id,["ventas"]);refreshTab();refreshSum();return}
  if(a==="addCurso"){p.e2=p.e2||{};p.e2.cursos=(p.e2.cursos||[]).concat([{id:uid(),nombre:"",hecho:false}]);save(id,["e2"]);refreshTab();return}
  if(a==="cursosBase"){p.e2=p.e2||{};const have=new Set((p.e2.cursos||[]).map(c=>c.nombre));p.e2.cursos=(p.e2.cursos||[]).concat((cfg().cursosBase||[]).filter(n=>!have.has(n)).map(n=>({id:uid(),nombre:n,hecho:false})));save(id,["e2"]);refreshTab();refreshSum();return}
  if(a==="addOtro"){p.otros=(p.otros||[]).concat([{id:uid(),nombre:""}]);save(id,["otros"]);refreshTab();return}
  if(a==="addNota"){const k=t.dataset.key,el=$("#nota-"+k),tx=el.value.trim();if(!tx)return;p[k]=(p[k]||[]).concat([{id:uid(),fecha:todayISO(),autor:S.me?S.me.nombre:"",rol:S.rol||"",texto:tx}]);save(id,[k]);refreshTab();return}
  if(a==="delRec"){const ok=await ask("Quitar recurso","Se quita para todos los gerentes.","Quitar");if(!ok)return;try{await api("delRecurso",{id:t.dataset.id});S.recursos=S.recursos.filter(r=>r._id!==t.dataset.id);render()}catch(e){toast(errMsg(e))}return}
  if(a==="saveCfg")return saveConfig();
});
document.addEventListener("change",async ev=>{
  const el=ev.target;
  if(el.dataset.filter){S.filters[el.dataset.filter]=el.value;S.filters.exp=false;render();return}
  if(el.hasAttribute("data-foto")){const f=el.files&&el.files[0];if(!f)return;try{const url=await fotoData(f);const p=cur();p.foto=url;save(S.openId,["foto"]);refreshTab();refreshSum();toast("Fotografía guardada.")}catch(e){toast("No se pudo leer la imagen. Prueba con un JPG o PNG.")}return}
  if(el.dataset.upload){const f=el.files&&el.files[0];if(!f)return;const p=cur(),id=S.openId;toast("Subiendo archivo…");try{const r=await upload(f);setP(p,el.dataset.upload,r);save(id,[el.dataset.upload.split(".")[0]]);refreshTab();refreshSum();toast("Archivo guardado.")}catch(e){toast(e.message||"No se pudo subir el archivo.")}return}
  if(el.dataset.path){const p=cur();if(!p)return;let v=el.type==="checkbox"?el.checked:el.value;
    if(el.type==="number"&&v!=="")v=+v;
    if(el.dataset.path==="e3.prorroga.limite"&&v&&p.e3&&p.e3.inicio&&v>addDays(p.e3.inicio,30)){toast("La prórroga no puede pasar del día 30.");el.value=(p.e3.prorroga||{}).limite||"";return}
    setP(p,el.dataset.path,v);const top=el.dataset.path.split(".")[0];save(S.openId,[top]);
    if(top==="ruta"||el.dataset.path==="adt.psp.alertas"||el.dataset.path.startsWith("adt.psp.alertas")||el.dataset.path.startsWith("adt.ko.")||el.dataset.path==="e2.certificado"){refreshTab()}
    refreshSum();return}
});
document.addEventListener("input",ev=>{if(ev.target.dataset.filter==="q"){S.filters.q=ev.target.value;clearTimeout(S._qt);S._qt=setTimeout(()=>{const pos=ev.target.selectionStart;render();const q=$("#f-q");if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(e){}}},250)}});
document.addEventListener("focusout",()=>{setTimeout(()=>{const a=document.activeElement;if(S.pendingRender&&!(a&&a.closest&&a.closest("[data-live]")&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render()},0)});
document.addEventListener("submit",async ev=>{if(ev.target.id!=="recForm")return;ev.preventDefault();
  const nombre=$("#rec-nombre").value.trim();if(!nombre){toast("Escribe el nombre del recurso.");return}
  const f=$("#rec-file").files[0],url=$("#rec-url").value.trim();if(!f&&!url){toast("Elige un archivo o escribe un enlace.");return}
  try{let file=null;if(f){toast("Subiendo archivo…");file=await upload(f)}
    const rec={etapa:$("#rec-etapa").value,nombre,uso:$("#rec-uso").value.trim(),file,url:url||null,fecha:todayISO()};
    const j=await api("addRecurso",{recurso:rec});S.recursos.push(Object.assign({_id:j.id},rec));render();toast("Recurso guardado.")}catch(e){toast(errMsg(e))}});
document.addEventListener("submit",async ev=>{if(ev.target.id!=="loginForm")return;ev.preventDefault();const pin=$("#login-pin").value.trim();if(!pin)return;$("#login-err").textContent="Entrando…";
  try{await login(pin,$("#login-rec").checked)}catch(e){$("#login-err").textContent=e.code==="pin"?"PIN no válido o usuario inactivo.":errMsg(e)}});

function refreshTab(){const el=$("#fx-tab");if(el&&cur())el.innerHTML=tabContent(cur(),S.tab);drawNames()}
function refreshSum(){const el=$("#fx-sum");if(el&&cur())el.innerHTML=fichaSummary(cur())}
function nuevoModal(){modal(`<h2>Registrar candidato</h2><div class="form">
  <label class="f wide"><span>Nombre completo</span><input id="n-nombre" type="text" required></label>
  <label class="f"><span>Ruta</span><select id="n-ruta"><option value="nuevo">Agente nuevo</option><option value="cedula">Agente con Cédula</option></select></label>
  <label class="f"><span>Teléfono</span><input id="n-tel" type="tel"></label><label class="f"><span>Correo</span><input id="n-correo" type="email"></label>
  <label class="f"><span>Ciudad</span><input id="n-ciudad" type="text"></label><label class="f"><span>Fuente</span><input id="n-fuente" type="text" list="dl-fn"></label>
  <label class="f"><span>Gerente de Desarrollo</span><input id="n-ger" type="text" list="dl-gn"></label></div>
  <datalist id="dl-fn"><option>Referido</option><option>Redes sociales</option><option>Bolsa de trabajo</option><option>Mercado natural del gerente</option><option>Evento</option></datalist><datalist id="dl-gn">${(cfg().gerentes||[]).map(g=>`<option>${esc(g)}</option>`).join("")}</datalist>
  <div class="row" style="justify-content:flex-end"><button class="btn" data-act="cancel">Cancelar</button><button class="btn primary" data-act="crear">Registrar</button></div>`)}
async function crearPersona(){
  const nombre=$("#n-nombre").value.trim();if(!nombre){toast("Escribe el nombre.");return}
  const d={nombre,ruta:$("#n-ruta").value,telefono:$("#n-tel").value.trim(),correo:$("#n-correo").value.trim(),ciudad:$("#n-ciudad").value.trim(),fuente:$("#n-fuente").value.trim(),gerente:$("#n-ger").value.trim(),etapa:1,fechas:{e1:todayISO()},creado:todayISO(),creadoPor:S.myId||"",salida:null};
  closeModal();
  d.creadoPor=S.me?S.me.nombre:"";
  if(S.demo){const id=uid();S.personas.set(id,d);S.openId=id;S.tab="e1";render();return}
  try{const j=await api("create",{data:d});S.personas.set(j.id,clone(d));S.openId=j.id;S.tab="e1";render();toast("Candidato registrado.")}catch(e){toast(errMsg(e))}
}
async function saveConfig(){
  const c=clone(S.config);c.metas=Object.assign({},DEF_CONFIG.metas,c.metas);
  document.querySelectorAll("[data-cfg]").forEach(el=>{const v=el.value===""?null:+el.value;setP(c,el.dataset.cfg,v)});
  document.querySelectorAll("[data-cfg-list]").forEach(el=>{c[el.dataset.cfgList]=el.value.split("\n").map(s=>s.trim()).filter(Boolean)});
  document.querySelectorAll("[data-cfg-text]").forEach(el=>{c[el.dataset.cfgText]=el.value});
  if(S.demo){S.config=c;toast("Vista de ejemplo: la configuración no se guarda.");render();return}
  try{await api("config",{config:c});S.config=c;toast("Configuración guardada.");render()}catch(e){toast(errMsg(e))}
}
async function drawNames(){}


function fotoData(file){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const m=240,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.75))};img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("img"))};img.src=u})}

function demoData(){
  const t=todayISO();
  S.personas.set("demo1",{nombre:"Laura Méndez (ejemplo)",ruta:"nuevo",ciudad:"Querétaro",gerente:"Gerente de Desarrollo",etapa:3,fechas:{e1:addDays(t,-40),e2:addDays(t,-20),e3:addDays(t,-9)},
    adt:{psp:{confiable:"si",estilo:"Interpersonal",rend:"promedio",ventas:"moderado",emp:"alto",alertas:{planificacion:"alerta",presentaciones:"alerta",cierre:"alerta",cumplimiento:"alerta"}},E1:{fecha:addDays(t,-40),decision:"Avanza",f:{v1:9,v2:8,v3:8,v4:7,v5:8,v6:8,t1:8,t2:9}},E2:{fecha:addDays(t,-33),decision:"Avanza",f:{v1:9,v2:8,v3:8,v4:8,v5:8,v6:7,t1:8,t2:9}},E3:{fecha:addDays(t,-27),decision:"Aceptado",f:{v1:9,v2:8,v3:9,v4:8,v5:8,v6:8,t1:9,t2:9}}},
    cartas:{c1:{fecha:addDays(t,-27)}},e2:{generacion:"Nov 2026",asistencia:100,certificado:"Sí",fin:addDays(t,-9),cursos:[{id:"a",nombre:"Introducción a Vida Individual",hecho:true},{id:"b",nombre:"Gastos Médicos Mayores básico",hecho:false}]},
    e3:{inicio:addDays(t,-9)},ventas:[{id:"v1",fecha:addDays(t,-4),ramo:"Vida Individual",prima:18500,negocio:"1"}],docs:{d0:{estado:"Entregado"},d1:{estado:"Entregado"},d2:{estado:"Entregado"}}});
  S.personas.set("demo2",{nombre:"Jorge Salinas (ejemplo)",ruta:"cedula",ciudad:"Guadalajara",gerente:"Gerente de Desarrollo",etapa:1,fechas:{e1:addDays(t,-6)},adt:{E1:{fecha:addDays(t,-6),decision:"Avanza"}}});

async function login(pin,recordar){
  S.pin=pin;const j=await api("load");
  S.me=j.user;S.rol=j.user.rol;S.myName=j.user.nombre;S.isAdmin=!!j.user.admin;S.canWrite=true;
  aplicar(j);S.loaded=true;setSync("ok");
  try{if(recordar)localStorage.setItem("campus-pin",pin);else sessionStorage.setItem("campus-pin",pin)}catch(e){}
  render();
}
function aplicar(j){
  if(j.personas)S.personas=new Map(j.personas.map(x=>[x.id,normP(clone(x.data))]));
  if(j.config)S.config=Object.assign(clone(DEF_CONFIG),j.config,{metas:Object.assign({},DEF_CONFIG.metas,j.config.metas||{}),comisiones:Object.assign({},DEF_CONFIG.comisiones,j.config.comisiones||{})});
  if(j.recursos)S.recursos=j.recursos;
}
function logout(){S.me=null;S.pin=null;S.personas=new Map();S.openId=null;try{localStorage.removeItem("campus-pin");sessionStorage.removeItem("campus-pin")}catch(e){}setSync("login");render()}
async function refrescar(){
  if(!S.me||S.pend>0||document.hidden)return;
  const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
  try{const j=await api("personas");if(S.pend>0)return;aplicar(j);setSync("ok");scheduleRender()}catch(e){setSync("off");if(e.code==="pin")logout()}
}
(async function init(){
  try{const h=location.hash.slice(1);if(["equipo","generaciones","recursos","configuracion"].includes(h))S.view=h}catch(e){}
  if(!API_URL){S.demo=true;demoData();setSync("demo");S.isAdmin=true;render();return}
  setSync("login");
  let pin=null;try{pin=localStorage.getItem("campus-pin")||sessionStorage.getItem("campus-pin")}catch(e){}
  if(pin){try{await login(pin,!!localStorage.getItem("campus-pin"))}catch(e){logout()}}else render();
  setInterval(refrescar,60000);
})();
</script>
